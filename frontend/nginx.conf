server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This proxy is only used for local/Docker Compose setups, where the
    # frontend and backend share Docker's internal network and the frontend
    # is built without VITE_API_URL (so it falls back to relative /api calls).
    #
    # On hosts like Render, the frontend and backend are separate services
    # with their own public URLs — the frontend is built with VITE_API_URL
    # pointing directly at the backend, so this block is never actually hit.
    # Docker's embedded DNS resolver (127.0.0.11) combined with a variable in
    # proxy_pass makes nginx resolve "backend" lazily at request time instead
    # of at startup, so it won't crash on hosts where that hostname doesn't
    # exist at all.
    #
    # IMPORTANT: once a variable is used in proxy_pass, nginx stops doing its
    # usual "replace the matched location with the proxy_pass URI" rewriting
    # — it would otherwise silently forward every request as a bare /api/,
    # dropping the actual path (e.g. /api/reports/dashboard) entirely. Using
    # $request_uri explicitly re-appends the original path so it's preserved.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $upstream_backend backend:5002;
        proxy_pass http://$upstream_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
